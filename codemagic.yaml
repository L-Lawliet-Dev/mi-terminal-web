workflows:
  android-build:
    name: L-OVERLORD-COMPILER
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Prepare Bin Folder
        script: mkdir -p assets/bin
      - name: Build Go Engine
        script: GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o assets/bin/dr-terminal main.go
      - name: Build Overlord APK
        script: |
          flutter packages pub get
          flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      